#:schema https://json.schemastore.org/pyproject.json

[project]
name = "isekaitavern"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.5"
dependencies = ["dacite", "discord.py", "dotenv", "assistant-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isekaitavern"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv", "venv", ".git", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG", # flake8-unused-arguments
  "SIM", # flake8-simplify
  "PTH", # flake8-use-pathlib
  "PL",  # pylint
  "RUF", # ruff-specific rules
]
ignore = [
  "E501",    # line too long (handled by formatter)
  "PIE796",  # enable non-unique enum
  "PLR0402", # follow by GUIDELINE.md
  "PLC0415", # import could inside function
  "PLR0913", # ignore too many arguments
  "RUF001",  # allow CJK fullwidth punctuation in user-facing strings
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
  "F401",
  "PLC0414",
  "I001",
] # unused imports, useless import alias

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv.sources]
assistant-core = { git = "https://github.com/urayoru113/assistant_core" }
